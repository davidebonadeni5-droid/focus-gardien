name: Focus Gardien (Windows .exe)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "captures/**"
  pull_request:

permissions:
  contents: write

# Un seul build à la fois par branche : un nouveau push annule l'ancien.
concurrency:
  group: focus-gardien-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Write version number
        # +100 : les versions continuent après celles construites dans l'ancien dépôt (v1 à v99)
        run: Set-Content -NoNewline -Path version.txt -Value ([int]$env:GITHUB_RUN_NUMBER + 100)

      - name: Build FocusGardien.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name FocusGardien
          --icon icone.ico
          --add-data "ui;ui"
          --add-data "icone.png;."
          --add-data "version.txt;."
          --hidden-import pystray._win32
          main.py

      - name: Self-test (everything loads)
        run: |
          $env:FOCUS_GARDIEN_DONNEES = "$env:RUNNER_TEMP\fg-selftest"
          $p = Start-Process dist\FocusGardien.exe -ArgumentList "--selftest","$env:RUNNER_TEMP\selftest.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\selftest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Smoke test (real window opens) + screenshot
        run: |
          $env:FOCUS_GARDIEN_DONNEES = "$env:RUNNER_TEMP\fg-smoke"
          New-Item -ItemType Directory -Force -Path capture-ci | Out-Null
          $p = Start-Process dist\FocusGardien.exe -ArgumentList "--fumee","$env:RUNNER_TEMP\fumee.json" -PassThru
          # attend que l'app signale que ses fenêtres sont prêtes, puis fait la capture
          $pret = "$env:RUNNER_TEMP\fumee.pret"
          for ($i = 0; $i -lt 90 -and -not (Test-Path $pret); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 3
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("capture-ci\windows.png")
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "Timeout"; exit 1 }
          Get-Content "$env:RUNNER_TEMP\fumee.json"
          $r = Get-Content "$env:RUNNER_TEMP\fumee.json" | ConvertFrom-Json
          if (-not $r.ok) { exit 1 }
          # le coin du mini Gardien doit laisser voir le bureau (pas de carré gris ni vert)
          if ($r.compagnon_pos) {
            $px = $bmp.GetPixel($r.compagnon_pos[0] + 4, $r.compagnon_pos[1] + 4)
            Write-Host "Coin du mini Gardien : R=$($px.R) G=$($px.G) B=$($px.B)"
            if (($px.R -eq 240 -and $px.G -eq 240 -and $px.B -eq 240) -or ($px.R -eq 1 -and $px.G -eq 1 -and $px.B -eq 1)) {
              Write-Host "Le mini Gardien n'est pas transparent"; exit 1
            }
          }

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-windows
          path: capture-ci/windows.png
          if-no-files-found: ignore

      - name: Upload FocusGardien.exe
        uses: actions/upload-artifact@v4
        with:
          name: FocusGardien
          path: dist/FocusGardien.exe

      - name: Publish release (the app updates itself from the latest one)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "v$(Get-Content version.txt)"
          $notes = "Télécharge **FocusGardien.exe**, puis double-clique dessus. Windows peut afficher « Windows a protégé votre ordinateur » : clique sur **Informations complémentaires**, puis **Exécuter quand même**.`n`nDéjà installé ? Rien à faire : l'app se met à jour toute seule."
          gh release create $v dist\FocusGardien.exe capture-ci\windows.png --target $env:GITHUB_SHA --title "Focus Gardien $v" --notes $notes --latest
